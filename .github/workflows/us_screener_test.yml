name: US Screener Test (temporary)

on:
  workflow_dispatch:

jobs:
  run-us-screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python screener_us.py
      - uses: actions/upload-artifact@v4
        with:
          name: screener-us-output
          path: screener_us_output.json
          retention-days: 3
